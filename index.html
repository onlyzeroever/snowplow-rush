// ---------------- AUDIO ----------------
// Real music loops + sampled sound effects, loaded from the artifact's own audio/ folder.
// Every effect has a tiny synth fallback so the game still beeps before files load.
const MUSIC={menu:{f:'audio/music_menu.mp3',a:0.5,b:38.9,vol:0.55},job:{f:'audio/music_job.mp3',a:0.5,b:44.1364,vol:0.5}};
const SFX_FILES=['click','deny','buy','coin','grab','combo','spill','bump','hit','gift','gold','time','tick','star1','star2','star3','fanfare','trophy','end','win','go','neighbour','daily','warn','squall','flump','throw','splat','whoosh','horn','moo','crunch','stomp','scrape_s','scrape_l','engine','jet','fire','beam'];
const SFX_LOOPS={scrape_s:[1.2,2.4],scrape_l:[1.2,2.4],engine:[1,2],jet:[1,2],fire:[1.2,2.4],beam:[1,2]};
const SFX_VOL={click:0.5,deny:0.55,buy:0.7,coin:0.32,grab:0.4,combo:0.4,spill:0.6,bump:0.7,hit:0.8,gift:0.75,gold:0.8,time:0.7,tick:0.45,star1:0.8,star2:0.8,star3:0.85,
  fanfare:0.8,trophy:0.75,end:0.6,win:0.8,go:0.6,neighbour:0.7,daily:0.7,warn:0.5,squall:0.55,flump:0.6,throw:0.5,splat:0.55,whoosh:0.5,horn:0.45,moo:0.7,crunch:0.8,stomp:0.6};
let AC=null,master=null,musicBus=null,sfxBus=null,noiseBuf=null;const BUF={};let audioLoading=false,curMusic=null,musicNode=null,musicGainNode=null,musicWant=null;
const loopNodes={};
function audioInit(){if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
    musicBus=AC.createGain();musicBus.gain.value=save.musicOff?0:1;musicBus.connect(master);sfxBus=AC.createGain();sfxBus.gain.value=save.muted?0:1;sfxBus.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;return;}
  loadAudio();}
function decodeBuf(ab){return new Promise((res,rej)=>{try{const p=AC.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej);}catch(e){rej(e);}});}
function loadAudio(){if(audioLoading||!AC)return;audioLoading=true;
  const get=(name,url)=>fetch(url).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(decodeBuf).then(b=>{BUF[name]=b;if(name==='m_'+musicWant)playMusic(musicWant,true);}).catch(()=>{});
  get('m_'+(musicWant||'menu'),MUSIC[musicWant||'menu'].f);
  for(const n of SFX_FILES)get(n,'audio/'+n+'.mp3');
  get('m_'+(musicWant==='job'?'menu':'job'),MUSIC[musicWant==='job'?'menu':'job'].f);}
function setMuted(m){save.muted=m;if(sfxBus)sfxBus.gain.value=m?0:1;if(m)stopLoops();persist();}
function setMusicOff(m){save.musicOff=m;if(musicBus)musicBus.gain.setTargetAtTime(m?0:1,AC.currentTime,0.05);persist();}
function playMusic(which,force){musicWant=which;if(!AC)return;if(curMusic===which&&!force&&musicNode)return;
  const buf=BUF['m_'+which];if(!buf)return;const now=AC.currentTime;
  if(musicNode){const old=musicNode,og=musicGainNode;og.gain.setTargetAtTime(0,now,0.25);setTimeout(()=>{try{old.stop();}catch(e){}},1500);}
  const m=MUSIC[which],src=AC.createBufferSource(),g=AC.createGain();src.buffer=buf;src.loop=true;src.loopStart=m.a;src.loopEnd=Math.min(m.b,buf.duration);
  g.gain.value=0;g.gain.setTargetAtTime(m.vol,now,0.3);src.connect(g);g.connect(musicBus);src.start(now,m.a);musicNode=src;musicGainNode=g;curMusic=which;}
function musicDuck(level){if(musicGainNode&&curMusic)musicGainNode.gain.setTargetAtTime(MUSIC[curMusic].vol*level,AC.currentTime,0.15);}
function musicRate(r){if(musicNode)musicNode.playbackRate.setTargetAtTime(r,AC.currentTime,0.2);}
function playBuf(name,vol,rate,pan){if(!AC||save.muted)return false;const buf=BUF[name];if(!buf)return false;
  const s=AC.createBufferSource(),g=AC.createGain();s.buffer=buf;s.playbackRate.value=rate||1;g.gain.value=(vol==null?1:vol)*(SFX_VOL[name]||0.6);
  if(pan&&AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=clamp(pan,-1,1);s.connect(g);g.connect(p);p.connect(sfxBus);}else{s.connect(g);g.connect(sfxBus);}
  s.start();return true;}
// continuous loops (scraping, engines, jet, fire, beam): call loopSet every frame while playing
function loopSet(name,gain,rate){if(!AC||save.muted)return;const buf=BUF[name];if(!buf)return;let n=loopNodes[name];
  if(!n){if(gain<=0.001)return;const s=AC.createBufferSource(),g=AC.createGain();s.buffer=buf;s.loop=true;const lp=SFX_LOOPS[name];s.loopStart=lp[0];s.loopEnd=lp[1];
    g.gain.value=0;s.connect(g);g.connect(sfxBus);s.start(0,lp[0]+Math.random()*(lp[1]-lp[0]));n=loopNodes[name]={s,g};}
  n.g.gain.setTargetAtTime(gain,AC.currentTime,0.06);if(rate)n.s.playbackRate.setTargetAtTime(rate,AC.currentTime,0.1);}
function stopLoops(){if(!AC)return;for(const k in loopNodes){const n=loopNodes[k];n.g.gain.setTargetAtTime(0,AC.currentTime,0.05);const s=n.s;setTimeout(()=>{try{s.stop();}catch(e){}},400);delete loopNodes[k];}}
function tone(f,dur,type,vol,slide,delay){if(!AC||save.muted)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol||0.1,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+dur+0.02);}
const lastSfx={};
const SCALE=[0,2,4,5,7,9,11,12,14,16,17,19,21,23,24];
function sfx(name,minGap,opt){const now=performance.now();if(minGap&&lastSfx[name]&&now-lastSfx[name]<minGap)return;lastSfx[name]=now;opt=opt||{};
  if(name==='scrape')return; // handled by the scrape loop
  let rate=opt.rate||1;
  if(name==='coin'||name==='grab')rate*=0.94+Math.random()*0.14;
  if(name==='combo')rate=Math.pow(2,SCALE[Math.min(SCALE.length-1,Math.max(0,(opt.step||0)))]/12);
  if(name==='click'||name==='bump')rate*=0.95+Math.random()*0.1;
  if(playBuf(name,opt.vol,rate,opt.pan))return;
  switch(name){ // fallbacks while files load
    case 'coin':tone(1320,0.05,'triangle',0.05,1760);break;
    case 'buy':tone(660,0.07,'triangle',0.1);tone(990,0.1,'triangle',0.1,null,0.07);break;
    case 'deny':tone(220,0.1,'triangle',0.08,150);break;
    case 'bump':case 'hit':tone(150,0.18,'sine',0.35,55);break;
    case 'click':tone(740,0.03,'triangle',0.06);break;
    case 'gift':case 'trophy':case 'fanfare':case 'daily':tone(784,0.08,'triangle',0.12);tone(1046,0.08,'triangle',0.12,null,0.08);tone(1318,0.14,'triangle',0.12,null,0.16);break;
    case 'warn':tone(880,0.07,'sine',0.06);tone(1175,0.07,'sine',0.06,null,0.11);break;
  }}
function sfxStar(i){if(!playBuf('star'+(i+1)))tone(880*Math.pow(1.26,i),0.2,'triangle',0.16);}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}

const save={coins:0,tool:0,lv:{speed:0,size:0,value:0,bumper:0,helpers:0},stars:Array(NL).fill(0),best:Array(NL).fill(0),muted:false,last:Date.now(),ctrl:'joy',tut:false,ach:{},stats:{cells:0,gifts:0,dodges:0,gnome:0,neighbours:0},hat:'yellow',hats:{yellow:true},daily:null,frost:0,winters:0,winterCoins:0,fails:Array(NL).fill(0),boostNext:false,gems:0,pro:false,adGems:null,dailySeen:'',winterSeen:false,musicOff:false,v:6,gold:-1,tolls:{},outfit:'classic',outfits:{classic:true},skin:{},skins:{},trail:'classic',trails:{classic:true},treasures:{}};
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s){
  if(!s.v||s.v<6){const oldIds=(!s.v)?['driveway','maple','lot','street','airport']:['driveway','culdesac','maple','lot','street','airport'];
    for(const k of ['stars','best','fails'])if(Array.isArray(s[k])){const o=s[k],n=Array(NL).fill(0);oldIds.forEach((id,j)=>{const ni=LEVELS.findIndex(l=>l.id===id);if(ni>=0)n[ni]=o[j]||0;});s[k]=n;}
    s.v=6;if(s.tool>=0){/* tools unchanged */}}
  Object.assign(save,s);save.lv=Object.assign({speed:0,size:0,value:0,bumper:0,helpers:0},s.lv||{});
  save.ach=Object.assign({},s.ach||{});save.stats=Object.assign({cells:0,gifts:0,dodges:0,gnome:0,neighbours:0},s.stats||{});save.hats=Object.assign({yellow:true},s.hats||{});save.outfits=Object.assign({classic:true},s.outfits||{});save.skin=Object.assign({},s.skin||{});save.skins=Object.assign({},s.skins||{});save.trails=Object.assign({classic:true},s.trails||{});save.treasures=Object.assign({},s.treasures||{});save.tolls=Object.assign({},s.tolls||{});
